name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  catraca:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
      PG_SSL: 'off'
      PG_VERSAO_ESPERADA: '18'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Convenções de migração
        run: npm run db:checar

      - name: Testes unitários
        run: npm run test:unit

      - name: Testes de integração
        run: npm run test:integracao

      - name: Build sem env (validação precisa ser preguiçosa)
        run: npm run build:e2e
        env:
          DATABASE_URL_ADMIN: ''
          PG_SSL: ''

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Jornadas no navegador
        run: npm run test:e2e -- --sem-build

      - name: Relatório das falhas no navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Forks e Dependabot não recebem secrets de Actions.
      - name: Conferência de migrações na Railway
        if: github.event_name == 'pull_request'
        env:
          DATABASE_URL_CONFERENCIA: ${{ secrets.DATABASE_URL_CONFERENCIA }}
          PG_SSL: verify
          PG_SSL_CA: ${{ vars.PG_SSL_CA_RAILWAY }}
          PG_SSL_NOME_SERVIDOR: postgres.railway.internal
          EH_FORK: ${{ github.event.pull_request.head.repo.fork }}
          AUTOR_PR: ${{ github.event.pull_request.user.login }}
        run: npx tsx scripts/ci/conferencia.mts
